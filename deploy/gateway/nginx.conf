# Pasarela del sistema (ADR-01, ADR-03, ADR-04).
# Un único origen: sirve la SPA y reenvía /api/ a la API y /tiles/ al servicio de teselas,
# autorizando cada pedido de teselas con la API (auth_request).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/gateway/security-headers.conf;

    # Las rutas internas nunca son alcanzables desde el navegador.
    location /internal/ {
        return 404;
    }

    # Subpedido de autorización: solo lo invoca auth_request, nunca el navegador.
    location = /_tile_access {
        internal;
        proxy_pass http://api:8080/internal/v1/tile-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:8080;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tiles/ {
        # Define $storage_key (con la API, o fija en la variante de desarrollo sin login).
        include /etc/nginx/gateway/tiles-auth.conf;
        proxy_pass http://tiles:8000;
        proxy_hide_header X-Request-ID;
        # Sobrescribe cualquier X-Storage-Key que mande el navegador (tiles.v1.yaml).
        proxy_set_header X-Storage-Key $storage_key;
        proxy_set_header X-Request-ID $request_id;
    }

    # Archivos con hash en el nombre: se pueden cachear sin vencimiento.
    location /assets/ {
        include /etc/nginx/gateway/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/gateway/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Cualquier otra ruta es de la SPA (rutas del lado del cliente).
    location / {
        try_files $uri /index.html;
    }
}
