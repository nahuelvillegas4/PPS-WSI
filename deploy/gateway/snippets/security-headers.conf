# Cabeceras de seguridad y trazabilidad (arquitectura 8.4 y 8.7).
# `add_header` de un location reemplaza las del server: por eso este archivo se incluye en cada uno.
# VERIFICAR: agregar Content-Security-Policy compatible con OpenSeadragon antes de endurecerla.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Request-ID $request_id always;
