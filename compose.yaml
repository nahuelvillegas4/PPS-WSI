# Compose integrado (ADR-11, arquitectura §7.1)
services:
  db:
    image: postgres:18
    container_name: gia-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gia_db}
      POSTGRES_USER: ${POSTGRES_USER:-gia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gia_dev_password_change_me}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gia-api
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-gia_db};Username=${POSTGRES_USER:-gia_user};Password=${POSTGRES_PASSWORD:-gia_dev_password_change_me};"
      DATA_PROTECTION_KEYS_PATH: ${DATA_PROTECTION_KEYS_PATH:-/keys}
    ports:
      # 8081 por defecto: el 8080 es del gateway (HTTP_PORT). La API se publica solo para
      # desarrollo (Swagger); el puerto desaparece cuando termine la integración (ADR-11).
      - "${API_PORT:-8081}:8080"
    volumes:
      - ${IMAGES_DIR:-./data/images}:/data/images:ro
      - dpkeys:/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servicio de teselas (PPS 1): solo la red interna lo alcanza; el navegador pasa por el gateway.
  tiles:
    build:
      context: ./tiles
      dockerfile: Dockerfile
    container_name: gia-tiles
    volumes:
      - ${IMAGES_DIR:-./data/images}:/data/images:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Pasarela (Nginx): único puerto publicado del sistema; sirve la SPA y reenvía /api/ y /tiles/.
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
    container_name: gia-gateway
    depends_on:
      api:
        condition: service_healthy
      tiles:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  dpkeys:
